# Regenerates the reference fixtures inside the pinned R-Gam-base image (tier 3) and fails if they
# differ in structure from the committed ones. Run by hand, or when oracle/ changes.
name: oracle-fixtures
on:
  workflow_dispatch:
  pull_request:
    paths: ["oracle/**", "tests/fixtures/**"]
env:
  HGAM_ORACLE_DIGEST: "sha256:2c27ebf1893e1f3214bd89bbbfc2a88a92b6423795732f0e57d7d88f54c4ccab"
jobs:
  fixtures:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jonathancrawford05/r-gam-base@sha256:2c27ebf1893e1f3214bd89bbbfc2a88a92b6423795732f0e57d7d88f54c4ccab
    steps:
      - uses: actions/checkout@v4
      - run: Rscript oracle/make_fixtures.R oracle_out
      - uses: actions/upload-artifact@v4
        with: { name: fixtures-tier3, path: oracle_out }
